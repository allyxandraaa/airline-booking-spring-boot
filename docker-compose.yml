services:
  postgres-customer:
    image: postgres:16-alpine
    env_file:
      - ./customer-service/.env
    volumes:
      - customer-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  customer-service:
    build: ./customer-service
    env_file:
      - ./customer-service/.env
    ports:
      - "8085:8085"
    depends_on:
      postgres-customer:
        condition: service_healthy

  postgres-flight:
    image: postgres:16-alpine
    env_file:
      - ./flight-service/.env
    volumes:
      - flight-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  flight-service:
    build: ./flight-service
    env_file:
      - ./flight-service/.env
    ports:
      - "8081:8081"
    depends_on:
      postgres-flight:
        condition: service_healthy

  postgres-booking:
    image: postgres:16-alpine
    env_file:
      - ./booking-service/.env
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  booking-service:
    build: ./booking-service
    env_file:
      - ./booking-service/.env
    ports:
      - "8082:8082"
    depends_on:
      postgres-booking:
        condition: service_healthy

  postgres-payment:
    image: postgres:16-alpine
    env_file:
      - ./payment-service/.env
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  payment-service:
    build: ./payment-service
    env_file:
      - ./payment-service/.env
    ports:
      - "8083:8083"
    depends_on:
      postgres-payment:
        condition: service_healthy

  postgres-overbooking:
    image: postgres:16-alpine
    env_file:
      - ./overbooking-service/.env
    volumes:
      - overbooking-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  overbooking-service:
    build: ./overbooking-service
    env_file:
      - ./overbooking-service/.env
    ports:
      - "8084:8084"
    depends_on:
      postgres-overbooking:
        condition: service_healthy

volumes:
  customer-db-data:
  flight-db-data:
  booking-db-data:
  payment-db-data:
  overbooking-db-data:
