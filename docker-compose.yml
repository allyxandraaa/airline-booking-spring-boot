services:
  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 10

  postgres-customer:
    image: postgres:16-alpine
    env_file:
      - ./customer-service/.env
    volumes:
      - customer-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  customer-service:
    build: ./customer-service
    env_file:
      - ./customer-service/.env
    ports:
      - "8085:8085"
    depends_on:
      postgres-customer:
        condition: service_healthy

  postgres-flight:
    image: postgres:16-alpine
    env_file:
      - ./flight-service/.env
    volumes:
      - flight-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  flight-service:
    build: ./flight-service
    env_file:
      - ./flight-service/.env
    ports:
      - "8081:8081"
    depends_on:
      postgres-flight:
        condition: service_healthy

  postgres-booking:
    image: postgres:16-alpine
    env_file:
      - ./booking-service/.env
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  booking-service:
    build: ./booking-service
    env_file:
      - ./booking-service/.env
    ports:
      - "8082:8082"
    depends_on:
      postgres-booking:
        condition: service_healthy
      kafka:
        condition: service_healthy

  postgres-payment:
    image: postgres:16-alpine
    env_file:
      - ./payment-service/.env
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  payment-service:
    build: ./payment-service
    env_file:
      - ./payment-service/.env
    ports:
      - "8083:8083"
    depends_on:
      postgres-payment:
        condition: service_healthy
      kafka:
        condition: service_healthy

  postgres-overbooking:
    image: postgres:16-alpine
    env_file:
      - ./overbooking-service/.env
    volumes:
      - overbooking-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  overbooking-service:
    build: ./overbooking-service
    env_file:
      - ./overbooking-service/.env
    ports:
      - "8084:8084"
    depends_on:
      postgres-overbooking:
        condition: service_healthy

volumes:
  customer-db-data:
  flight-db-data:
  booking-db-data:
  payment-db-data:
  overbooking-db-data:
