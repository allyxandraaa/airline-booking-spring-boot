server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service
  reactor:
    context-propagation: auto
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/airline}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/airline/protocol/openid-connect/certs}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH_RATE:10}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST_CAPACITY:20}
                key-resolver: "#{@userKeyResolver}"
          routes:
            - id: passengers
              uri: ${PASSENGER_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/passengers/**
            - id: flights
              uri: ${FLIGHT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/flights/**,/api/v1/reservations/**
            - id: bookings
              uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/bookings/**
            - id: payments
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/payments/**
            - id: overbooking
              uri: ${OVERBOOKING_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/overbooking/**

management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
