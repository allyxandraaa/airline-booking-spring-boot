apiVersion: v1
kind: ConfigMap
metadata:
  name: booking-service-config
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8082"
  DB_URL: "jdbc:postgresql://postgres-booking:5432/booking_db"
  DB_USER: "postgres"
  SPRING_JPA_SHOW_SQL: "false"
  FLIGHT_SERVICE_URL: "http://flight-service:8081"
  FLIGHT_GRPC_TARGET: "flight-service:9081"
  PASSENGER_SERVICE_URL: "http://passenger-service:8085"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  OTEL_TRACES_ENDPOINT: "http://otel-collector:4318/v1/traces"
