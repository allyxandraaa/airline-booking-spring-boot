apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-customer-service-to-postgres-customer
spec:
  podSelector:
    matchLabels:
      app: postgres-customer
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: customer-service
      ports:
        - port: 5432
