apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-flight-service-to-postgres-flight
spec:
  podSelector:
    matchLabels:
      app: postgres-flight
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: flight-service
      ports:
        - port: 5432
