apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: airline-ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/v1/passengers
            pathType: Prefix
            backend:
              service:
                name: customer-service
                port:
                  number: 8085
          - path: /api/v1/flights
            pathType: Prefix
            backend:
              service:
                name: flight-service
                port:
                  number: 8081
          - path: /api/v1/reservations
            pathType: Prefix
            backend:
              service:
                name: flight-service
                port:
                  number: 8081
          - path: /api/v1/bookings
            pathType: Prefix
            backend:
              service:
                name: booking-service
                port:
                  number: 8082
          - path: /api/v1/payments
            pathType: Prefix
            backend:
              service:
                name: payment-service
                port:
                  number: 8083
          - path: /api/v1/overbooking
            pathType: Prefix
            backend:
              service:
                name: overbooking-service
                port:
                  number: 8084
