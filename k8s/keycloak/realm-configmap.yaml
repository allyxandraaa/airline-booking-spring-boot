apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
data:
  airline-realm.json: |
    {
      "realm": "airline",
      "enabled": true,
      "displayName": "Airline Booking",
      "sslRequired": "none",
      "registrationAllowed": true,
      "registrationEmailAsUsername": true,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "verifyEmail": false,
      "clients": [
        {
          "clientId": "airline-client",
          "name": "Airline API client",
          "enabled": true,
          "publicClient": true,
          "protocol": "openid-connect",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "implicitFlowEnabled": false,
          "serviceAccountsEnabled": false,
          "redirectUris": ["*"]
        }
      ]
    }
