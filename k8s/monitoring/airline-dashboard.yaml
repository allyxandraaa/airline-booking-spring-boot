apiVersion: v1
kind: ConfigMap
metadata:
  name: airline-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  airline-overview.json: |
    {
      "uid": "airline-overview",
      "title": "Airline Booking: огляд системи",
      "tags": [
        "airline"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Платежі за статусом (за секунду)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (status) (rate(payments_processed_total[5m]))",
              "legendFormat": "{{status}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Частка відхилених платежів",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(payments_processed_total{status=\"DECLINED\"}[5m])) / sum(rate(payments_processed_total[5m]))",
              "legendFormat": "decline ratio"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Середній час від бронювання до підтвердження",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "rate(bookings_confirmation_duration_seconds_sum[5m]) / rate(bookings_confirmation_duration_seconds_count[5m])",
              "legendFormat": "avg"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Події outbox, ще не відправлені в Kafka",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(outbox_pending_events)",
              "legendFormat": "pending"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Зняті з рейсу бронювання за результатом",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (outcome) (increase(overbooking_bumped_total[1h]))",
              "legendFormat": "{{outcome}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Середня тривалість компенсацій овербукінгу",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "rate(overbooking_compensation_seconds_sum[5m]) / rate(overbooking_compensation_seconds_count[5m])",
              "legendFormat": "avg"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Середня розрахована ціна квитка",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "rate(flights_price_economy_sum[5m]) / rate(flights_price_economy_count[5m])",
              "legendFormat": "economy"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "rate(flights_price_business_sum[5m]) / rate(flights_price_business_count[5m])",
              "legendFormat": "business"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Circuit Breaker: стан paymentClient",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "resilience4j_circuitbreaker_state{name=\"paymentClient\"}",
              "legendFormat": "{{state}}"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "HTTP-запити за сервісами (за секунду)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 32,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (service) (rate(http_server_requests_seconds_count[1m]))",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Запити шлюзу за кодом відповіді (429 = ліміт)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 32,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (httpStatusCode) (rate(spring_cloud_gateway_requests_seconds_count[1m]))",
              "legendFormat": "{{httpStatusCode}}"
            }
          ]
        }
      ]
    }
