apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: airline-services
  namespace: monitoring
  labels:
    release: prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - customer-service
          - flight-service
          - booking-service
          - payment-service
          - overbooking-service
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s
