apiVersion: apps/v1
kind: Deployment
metadata:
  name: overbooking-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: overbooking-service
  template:
    metadata:
      labels:
        app: overbooking-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: overbooking-service
          image: overbooking-service:1.0
          ports:
            - containerPort: 8084
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          envFrom:
            - configMapRef:
                name: overbooking-service-config
            - secretRef:
                name: overbooking-service-secret
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
      volumes:
        - name: tmp
          emptyDir: {}
