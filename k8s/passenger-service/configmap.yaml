apiVersion: v1
kind: ConfigMap
metadata:
  name: passenger-service-config
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8085"
  DB_URL: "jdbc:postgresql://postgres-passenger:5432/passenger_db"
  DB_USER: "postgres"
  SPRING_JPA_SHOW_SQL: "false"
  OTEL_TRACES_ENDPOINT: "http://otel-collector:4318/v1/traces"
