apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-passenger-service-to-postgres-passenger
spec:
  podSelector:
    matchLabels:
      app: postgres-passenger
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: passenger-service
      ports:
        - port: 5432
