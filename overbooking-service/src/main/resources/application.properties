spring.application.name=overbooking-service
server.port=${SERVER_PORT:8084}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/overbooking_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoints.web.exposure.include=health,prometheus

management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false

spring.grpc.client.channel.booking.target=${BOOKING_GRPC_TARGET:localhost:9082}
spring.grpc.client.channel.booking.default.deadline=10s
spring.grpc.client.channel.booking.service-config.method[0].name[0].service=airline.booking.v1.BookingService
spring.grpc.client.channel.booking.service-config.method[0].name[0].method=StreamBookings
spring.grpc.client.channel.booking.service-config.method[0].name[1].service=airline.booking.v1.BookingService
spring.grpc.client.channel.booking.service-config.method[0].name[1].method=StreamConfirmedBookings
spring.grpc.client.channel.booking.service-config.method[0].name[2].service=airline.booking.v1.BookingService
spring.grpc.client.channel.booking.service-config.method[0].name[2].method=BumpBooking
spring.grpc.client.channel.booking.service-config.method[0].retry.max-attempts=3
spring.grpc.client.channel.booking.service-config.method[0].retry.initial-backoff=100ms
spring.grpc.client.channel.booking.service-config.method[0].retry.max-backoff=1s
spring.grpc.client.channel.booking.service-config.method[0].retry.backoff-multiplier=2
spring.grpc.client.channel.booking.service-config.method[0].retry.retryable-status-codes=UNAVAILABLE

spring.grpc.client.channel.flight.target=${FLIGHT_GRPC_TARGET:localhost:9081}
spring.grpc.client.channel.flight.default.deadline=3s
spring.grpc.client.channel.flight.service-config.method[0].name[0].service=airline.flight.v1.FlightService
spring.grpc.client.channel.flight.service-config.method[0].name[0].method=GetFlightCapacity
spring.grpc.client.channel.flight.service-config.method[0].retry.max-attempts=3
spring.grpc.client.channel.flight.service-config.method[0].retry.initial-backoff=100ms
spring.grpc.client.channel.flight.service-config.method[0].retry.max-backoff=1s
spring.grpc.client.channel.flight.service-config.method[0].retry.backoff-multiplier=2
spring.grpc.client.channel.flight.service-config.method[0].retry.retryable-status-codes=UNAVAILABLE

spring.grpc.client.channel.payment.target=${PAYMENT_GRPC_TARGET:localhost:9083}
spring.grpc.client.channel.payment.default.deadline=10s
spring.grpc.client.channel.payment.service-config.method[0].name[0].service=airline.payment.v1.PaymentService
spring.grpc.client.channel.payment.service-config.method[0].name[0].method=ProcessRefunds
spring.grpc.client.channel.payment.service-config.method[0].name[1].service=airline.payment.v1.PaymentService
spring.grpc.client.channel.payment.service-config.method[0].name[1].method=RefundBatch
spring.grpc.client.channel.payment.service-config.method[0].retry.max-attempts=3
spring.grpc.client.channel.payment.service-config.method[0].retry.initial-backoff=100ms
spring.grpc.client.channel.payment.service-config.method[0].retry.max-backoff=1s
spring.grpc.client.channel.payment.service-config.method[0].retry.backoff-multiplier=2
spring.grpc.client.channel.payment.service-config.method[0].retry.retryable-status-codes=UNAVAILABLE

resilience4j.circuitbreaker.instances.paymentClient.sliding-window-size=10
resilience4j.circuitbreaker.instances.paymentClient.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.paymentClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentClient.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.paymentClient.record-exceptions=io.grpc.StatusRuntimeException

resilience4j.bulkhead.instances.paymentClient.max-concurrent-calls=10
resilience4j.bulkhead.instances.paymentClient.max-wait-duration=0
